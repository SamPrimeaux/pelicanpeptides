<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Return page after Square checkout." />
    <title>Checkout Return | Pelican Peptides</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <style>
      :root {
        --primary: #004E8A;
        --secondary: #0077BE;
        --dark: #0A1F44;
        --gray-100: #F8F9FA;
        --gray-200: #E9ECEF;
        --gray-500: #6C757D;
        --white: #FFFFFF;
        --radius: 14px;
        --shadow-md: 0 10px 22px rgba(0, 0, 0, 0.10);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(900px 420px at 15% 0%, rgba(0,168,204,.10), transparent 60%),
          radial-gradient(900px 420px at 85% 0%, rgba(0,119,190,.10), transparent 55%),
          var(--gray-100);
        color: var(--dark);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(760px, 100%);
        background: rgba(255,255,255,.88);
        border: 1px solid var(--gray-200);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        padding: 22px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      h1 { margin: 0 0 8px; font-size: 1.55rem; letter-spacing: -0.02em; }
      p { margin: 0 0 14px; color: var(--gray-500); line-height: 1.65; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid var(--gray-200);
        background: var(--white);
        border-radius: 999px;
        color: var(--gray-500);
        font-weight: 700;
        font-size: 0.9rem;
        margin-top: 6px;
      }
      .actions { display:flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
      a.btn {
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 800;
        border: 1px solid transparent;
      }
      a.btn-primary { background: var(--primary); color: var(--white); border-color: var(--primary); }
      a.btn-outline { background: var(--white); color: var(--secondary); border-color: rgba(0,119,190,.45); }
      a.btn:focus { outline: none; box-shadow: 0 0 0 4px rgba(0,168,204,.14); }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <h1>Thanks — you’re back from checkout</h1>
      <p>
        If you completed payment, Square will have processed it on their hosted checkout page.
        This return page is just a confirmation landing page (it does not validate payment by itself).
      </p>

      <div class="pill" id="qs">Return params: <code>none</code></div>

      <div class="actions">
        <a class="btn btn-primary" href="/">Back to catalog</a>
        <a class="btn btn-outline" href="/">Home</a>
      </div>
    </main>

    <script>
      const el = document.getElementById("qs");
      const qs = new URLSearchParams(location.search);
      const keys = Array.from(qs.keys());
      el.innerHTML = keys.length
        ? `Return params: <code>${keys.map(k => `${k}=${qs.get(k)}`).join("&")}</code>`
        : "Return params: <code>none</code>";
    </script>
  </body>
</html>
